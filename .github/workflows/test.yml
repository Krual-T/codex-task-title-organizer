name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hook-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile hook
        run: python -m compileall -q plugins/codex-task-title-organizer/scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
